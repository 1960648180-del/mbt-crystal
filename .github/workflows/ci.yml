name: CI

# 这个工作流的价值：把"在我机器上能跑"变成"换一台干净机器也能跑"。
# 竞品/评委/未来的你，只要能看到这个绿勾，就知道验证是可复现的。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # 允许手动点一下触发

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 MoonBit 工具链
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: 显示工具链版本
        run: moon version --all

      - name: 刷新包注册表索引
        # 干净环境（比如一台全新的 CI 机器）里 ~/.moon/registry 是空的，
        # 不刷新的话连 moonbitlang/x 都解析不到，会报
        #   "module was not found in the registry"
        # 顺便记一条教训：`moon install`（不带参数）已经废弃，别再用它拉依赖了。
        run: moon update

      - name: 编译检查
        run: moon check

      - name: 白盒单元测试（直接调包内私有函数）
        run: moon test

      - name: 端到端验证（真实文件体积 + pymatgen 对称展开对照）
        run: |
          python -m pip install --quiet pymatgen
          python tests/tools/verify.py
